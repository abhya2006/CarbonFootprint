# Zero-setup profile: in-memory H2 database, no MySQL install required.
# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
#            or:  java -jar target/ecotrack-api-1.0.0.jar --spring.profiles.active=h2
# Data lives only in memory and resets on restart (demo seed data is re-created each boot).

spring.datasource.url=jdbc:h2:mem:ecotrack;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# schema.sql is MySQL-specific reference DDL; let Hibernate build the schema from the
# JPA entities instead of running that script against H2.
spring.sql.init.mode=never

# Browse the in-memory DB at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:ecotrack, user: sa, no password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
